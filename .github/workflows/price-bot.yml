name: price-bot
on:
  schedule:
    - cron: '15 10 * * *'   # ~6:15 AM ET during EDT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: gen-sitemap dates each page from the last commit that
          # touched it. At the default depth of 1 every file would miss its
          # commit date and fall back to mtime — which in CI is checkout time,
          # stamping all 94 pages as changed today, every night. The script
          # refuses to run on a shallow clone rather than publish that.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run price bot
        run: node scripts/price-bot.mjs
      - name: Refresh the curated front-page board
        # Verdicts stay hand-written; prices and the check date come from tonight's
        # feed. Without this step the board only updated when someone ran it by
        # hand, which is how it sat on July 13 prices for three weeks.
        run: node scripts/build-deals.mjs
      - name: Refresh department hub pages
        run: node scripts/build-deal-hubs.mjs
      - name: Refresh the launch-monitor price ladder
        run: node scripts/build-launch-monitors.mjs
      - name: Rebuild the deals grid and the homepage strip
        # Re-verifies every card against the retailer's own product page before
        # republishing it, so a sale that ended overnight drops off instead of
        # sitting there quoting yesterday's number. continue-on-error because a
        # CJ outage should cost us the grid for a day, not the whole refresh.
        continue-on-error: true
        env:
          CJ_PERSONAL_ACCESS_TOKEN: ${{ secrets.CJ_PERSONAL_ACCESS_TOKEN }}
          CJ_COMPANY_ID: ${{ secrets.CJ_COMPANY_ID }}
        # 30, not 8. The board is grouped into five price bands of up to six
        # cards; at --limit 8 there are not enough verified items to fill the
        # middle bands, so the nightly run was quietly shrinking a 24-card board
        # back to 8 and collapsing it to two bands.
        run: node scripts/build-deals-grid.mjs --limit 30
      - name: Regenerate sitemap.xml
        # /deals and the four department hubs are declared changefreq=daily and
        # are in fact rewritten every night — but the sitemap was only rebuilt
        # when someone ran it by hand, so it advertised week-old lastmod dates
        # for pages that had changed hours earlier. Google reads lastmod as the
        # recrawl hint; a stale one is a reason not to come back.
        run: node scripts/gen-sitemap.mjs
      - name: Fail if the deals grid has gone stale
        # The rebuild above is continue-on-error so one bad night does not cost
        # us the whole refresh. The danger in that is silence: the job reports
        # success, the grid keeps yesterday's cards, and nobody finds out until
        # a reader clicks a price that no longer exists. So a single miss stays
        # quiet, and a run of them fails the workflow, which emails Robert.
        run: |
          node -e '
            const fs = require("fs");
            const f = "data/deals-grid.json";
            if (!fs.existsSync(f)) { console.error("no deals-grid.json at all"); process.exit(1); }
            const checked = new Date(JSON.parse(fs.readFileSync(f, "utf8")).checked_at);
            const days = (Date.now() - checked.getTime()) / 86400000;
            console.log(`deals grid last verified ${days.toFixed(1)} days ago`);
            if (days > 3) {
              console.error("Deals grid has not rebuilt in over 3 days — prices on the homepage and /deals are no longer being checked. Look at the rebuild step above.");
              process.exit(1);
            }
          '
      - name: Commit price log
        if: always()
        run: |
          git config user.name "mm-price-bot"
          git config user.email "price-bot@mulliganmemo.com"
          # sitemap.xml belongs here or the regen step above silently throws its
          # own output away every night.
          git add data/ deals/ deals.html launch-monitors.html index.html styles/deals.css sitemap.xml
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "price-bot: nightly log $(date -u +%Y-%m-%d)"
            git push
          fi
