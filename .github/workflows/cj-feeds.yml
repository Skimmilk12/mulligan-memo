name: cj-feeds
# SEPARATE WORKFLOW BECAUSE SCHEDULES ARE WORKFLOW-LEVEL IN ACTIONS.
#
# This lived inside price-bot.yml and never once succeeded. That job fires at
# 11:10 UTC; CJ does not publish the day's export until roughly 18:00 UTC, so
# every night it requested a file that did not exist, logged "no file for
# <date>", and — being continue-on-error — reported success. Four consecutive
# silent failures.
#
# The reason that matters more than a normal bug: CJ retains only the CURRENT
# day's file. The Aug 8 export was already 404 by Aug 12, so Aug 9, 10 and 11
# are gone permanently. A missed window is not a retryable failure.
on:
  schedule:
    - cron: '0 21 * * *'   # 21:00 UTC — ~3h after CJ's usual ~18:00 delivery, same UTC day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Snapshot the CJ product feeds
        # TGW publishes a price and no compare-at price, so a discount can only
        # be derived by diffing consecutive days. Publishes nothing to the site;
        # it only accumulates data/feeds/*.json.
        env:
          CJ_FEED_USER: ${{ secrets.CJ_FEED_USER }}
          CJ_FEED_PASS: ${{ secrets.CJ_FEED_PASS }}
        run: node scripts/fetch-cj-feeds.mjs
      - name: Fail if the TGW snapshots have gone quiet for two weeks
        # CJ only writes an export file when the advertiser's catalog CHANGED.
        # Cowork checked the portal on 2026-09-11: subscription 320166 was
        # healthy, but TGW's own catalog at CJ had not been updated since
        # 13 Aug, so CJ exported "0 Records" on 31 Aug and nothing since. The
        # previous check failed on any missing day and so emailed a false alarm
        # 27 nights running. A missing day is normal; a fortnight of silence is
        # worth one look, so this nags ONCE A WEEK (Mondays) after 14 quiet days.
        # Before touching code: CJ portal -> Product Feeds -> View Status ->
        # "Last Updated" for the advertiser. If that date is old, the fix is a
        # message to TGW's affiliate manager, not a script.
        run: |
          node -e '
            const fs = require("fs");
            const day = new Date().toISOString().slice(0, 10);
            const today = `data/feeds/tgw-${day}.json`;
            if (fs.existsSync(today)) {
              console.log(`TGW snapshot for ${day}: ${JSON.parse(fs.readFileSync(today, "utf8")).tracked} products tracked`);
              process.exit(0);
            }
            const days = fs.readdirSync("data/feeds").filter(f => /^tgw-\d{4}-\d{2}-\d{2}\.json$/.test(f)).map(f => f.slice(4, 14)).sort();
            const newest = days[days.length - 1];
            const quiet = newest ? Math.floor((Date.parse(day) - Date.parse(newest)) / 86400000) : 999;
            console.log(`No TGW file for ${day}; newest snapshot is ${newest || "none"} (${quiet} days ago). CJ only delivers when TGW changes its catalog.`);
            if (quiet >= 14 && new Date().getUTCDay() === 1) {
              console.error(`TGW has delivered nothing for ${quiet} days. Check CJ -> Product Feeds -> View Status "Last Updated" for TGW; if it is old, message TGW affiliate support (see drafts/NEXT-SESSION.md).`);
              process.exit(1);
            }
          '
      - name: Commit the snapshot
        if: always()
        run: |
          git config user.name "mm-price-bot"
          git config user.email "price-bot@mulliganmemo.com"
          git add data/feeds/
          if git diff --cached --quiet; then
            echo "no new snapshot"
          else
            git commit -m "cj-feeds: snapshot $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi
